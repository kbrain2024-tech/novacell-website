<!doctype html><html lang="ko" class="notranslate" translate="no"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>결제 확인 | NovaCell</title><link rel="stylesheet" href="css/auth.css"></head><body class="auth-page"><main class="auth-layout"><section class="auth-card" style="max-width:680px;margin:auto;text-align:center"><h1 id="title">결제를 확인하고 있습니다</h1><p id="message">화면을 닫지 말고 잠시 기다려 주세요.</p><a id="next" class="auth-submit" href="mypage.html" hidden>마이페이지로 이동</a></section></main><script src="js/novacell-auth-config.js"></script><script src="js/novacell-auth.js"></script><script>(async()=>{const q=new URLSearchParams(location.search),lang=q.get('lang')==='en'?'en':'ko',title=document.getElementById('title'),message=document.getElementById('message'),next=document.getElementById('next');try{const session=await NovaCellAuth.getSession();if(!session){location.replace(`login.html?lang=${lang}&return=${encodeURIComponent(location.href)}`);return;}const response=await fetch('/.netlify/functions/confirm-toss-payment',{method:'POST',headers:{'Content-Type':'application/json',Authorization:`Bearer ${session.access_token}`},body:JSON.stringify({paymentKey:q.get('paymentKey'),orderId:q.get('orderId'),amount:Number(q.get('amount'))})});const data=await response.json().catch(()=>({}));if(!response.ok)throw new Error(data.message||'결제 확인에 실패했습니다.');title.textContent=lang==='en'?'Payment completed':'결제가 완료되었습니다';message.textContent=lang==='en'?'Your 365-day pass is now active.':'로그인한 계정에 365일 이용권이 발급되었습니다.';next.textContent=lang==='en'?'Go to My Account':'마이페이지로 이동';next.hidden=false;}catch(error){title.textContent=lang==='en'?'Confirmation required':'확인이 필요합니다';message.textContent=(error.message||'결제를 확인하지 못했습니다.')+(lang==='en'?' If you were charged, do not pay again; contact support.':' 결제 문자를 받았다면 재결제하지 말고 고객센터로 문의해 주세요.');}})();</script></body></html>
