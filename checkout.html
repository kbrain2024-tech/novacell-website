<!doctype html>
<html lang="ko" class="notranslate" translate="no">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="google" content="notranslate"><meta name="robots" content="noindex,nofollow">
  <title>안전한 결제 | NovaCell</title><link rel="stylesheet" href="css/auth.css">
  <script src="https://js.tosspayments.com/v2/standard"></script>
  <style>.checkout-main{max-width:760px;margin:auto;padding:110px 20px 60px}.checkout-card{background:#fff;color:#10243a;border-radius:22px;padding:clamp(20px,4vw,36px);box-shadow:0 24px 70px rgba(0,0,0,.3)}.checkout-card h1{margin-top:0}.checkout-state{padding:13px;border-radius:10px;background:#edf7fa;margin:16px 0}.checkout-state.error{background:#fff0f0;color:#a51d2d}.pay-button{width:100%;border:0;border-radius:12px;padding:16px;font-weight:800;background:#16c4d7;color:#062135;font-size:1rem;cursor:pointer}.pay-button:disabled{opacity:.55;cursor:not-allowed}.checkout-safe{font-size:.88rem;color:#64748b;line-height:1.6}</style>
</head>
<body class="auth-page">
  <main class="checkout-main"><div class="checkout-card"><a href="products.html">← 이용권으로 돌아가기</a><h1 id="checkoutTitle">안전한 결제</h1><p id="checkoutIntro">회원과 주문 금액을 확인한 후 토스페이먼츠 결제창을 엽니다.</p><div id="checkoutState" class="checkout-state">결제를 준비하고 있습니다.</div><div id="payment-method"></div><div id="agreement"></div><p class="checkout-safe">카드·계좌 정보는 NovaCell 서버에 저장되지 않고 결제사가 처리합니다. 테스트 단계에서는 토스 테스트 키만 사용하세요.</p><button id="payButton" class="pay-button" disabled>결제 준비 중…</button></div></main>
  <script src="js/novacell-auth-config.js"></script><script src="js/novacell-auth.js"></script>
  <script>
  (async()=>{const q=new URLSearchParams(location.search),lang=q.get('lang')==='en'?'en':'ko',product=q.get('product'),state=document.getElementById('checkoutState'),button=document.getElementById('payButton');
    const copy=lang==='en'?{title:'Secure checkout',intro:'Confirm your account and order before opening Toss Payments.',loading:'Preparing payment…',login:'Please sign in first.',pay:n=>`Pay KRW ${n.toLocaleString()}`,error:'Payment is not ready. Please check the setup guide.'}:{title:'안전한 결제',intro:'회원과 주문 금액을 확인한 후 토스페이먼츠 결제창을 엽니다.',loading:'결제를 준비하고 있습니다.',login:'먼저 로그인해 주세요.',pay:n=>`${n.toLocaleString()}원 결제하기`,error:'결제를 시작할 수 없습니다. 설정 안내서를 확인해 주세요.'};
    document.documentElement.lang=lang;document.getElementById('checkoutTitle').textContent=copy.title;document.getElementById('checkoutIntro').textContent=copy.intro;state.textContent=copy.loading;
    try{if(!['reflex_therapy_1y','healing_points_1y'].includes(product))throw new Error('상품 선택을 확인해 주세요.');const session=await NovaCellAuth.getSession();if(!session){location.replace(`login.html?lang=${lang}&return=${encodeURIComponent(location.href)}`);return;}const response=await fetch('/.netlify/functions/create-payment-order',{method:'POST',headers:{'Content-Type':'application/json',Authorization:`Bearer ${session.access_token}`},body:JSON.stringify({product_code:product,lang})});const order=await response.json().catch(()=>({}));if(!response.ok)throw new Error(order.message||copy.error);if(!window.TossPayments)throw new Error('결제 모듈을 불러오지 못했습니다.');const toss=TossPayments(order.clientKey),widgets=toss.widgets({customerKey:order.customerKey});await widgets.setAmount({currency:'KRW',value:order.amount});await Promise.all([widgets.renderPaymentMethods({selector:'#payment-method',variantKey:'DEFAULT'}),widgets.renderAgreement({selector:'#agreement',variantKey:'AGREEMENT'})]);state.textContent=`${order.orderName} · ${order.amount.toLocaleString()}원`;button.disabled=false;button.textContent=copy.pay(order.amount);button.onclick=()=>widgets.requestPayment({orderId:order.orderId,orderName:order.orderName,successUrl:order.successUrl,failUrl:order.failUrl,customerEmail:order.customerEmail,customerName:order.customerName});}catch(error){state.classList.add('error');state.textContent=error.message||copy.error;button.textContent=copy.error;}})();
  </script>
</body></html>
